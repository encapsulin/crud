plugins {
	id 'java'
	id 'org.springframework.boot' version '3.0.4'
	id 'io.spring.dependency-management' version '1.1.0'
	//	id 'org.springframework.boot' version '2.7.9'
//	id 'io.spring.dependency-management' version '1.0.15.RELEASE'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
sourceCompatibility = '17'

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	implementation 'org.springframework.boot:spring-boot-starter-web'

	runtimeOnly 'com.h2database:h2'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

// https://mvnrepository.com/artifact/software.amazon.awssdk/dynamodb
	implementation group: 'software.amazon.awssdk', name: 'dynamodb', version: '2.20.47'
// https://mvnrepository.com/artifact/software.amazon.awssdk/s3
	implementation group: 'software.amazon.awssdk', name: 's3', version: '2.20.47'
//// https://mvnrepository.com/artifact/software.amazon.awssdk/sdk-core
//	implementation group: 'software.amazon.awssdk', name: 'sdk-core', version: '2.20.47'
//// https://mvnrepository.com/artifact/software.amazon.awssdk/aws-core
//	implementation group: 'software.amazon.awssdk', name: 'aws-core', version: '2.20.47'
//// https://mvnrepository.com/artifact/com.amazonaws/aws-java-sdk
//	implementation group: 'com.amazonaws', name: 'aws-java-sdk', version: '1.12.450'
// https://mvnrepository.com/artifact/software.amazon.awssdk/bom
	runtimeOnly group: 'software.amazon.awssdk', name: 'bom', version: '2.20.47', ext: 'pom'

//	implementation(platform("software.amazon.awssdk:bom:2.18.10"))
//	implementation("software.amazon.awssdk:dynamodb")
//	implementation("software.amazon.awssdk:dynamodb-enhanced")
	implementation group: 'software.amazon.awssdk', name: 'dynamodb-enhanced', version: '2.20.47'

}

tasks.named('test') {
	useJUnitPlatform()
}
