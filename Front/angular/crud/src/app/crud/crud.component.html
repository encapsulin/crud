<div class="container">
    <h1>Title</h1>
    <div>Description Description Description </div>
</div>

<div class="container">

    <div class="div-row">
        <h2>Items:</h2>
        <button class="btn-round">+</button>
    </div>

    <table>
        <tr>
            <th>Title</th>
            <th>Description</th>
            <th>Price</th>
            <th></th>
        </tr>

        <tr *ngFor="let item of items">
            <td>{{item.title}}</td>
            <td>{{item.descr}}</td>
            <td>{{item.price}}</td>
            <td><button class="btn-round">...</button> <button class="btn-round">x</button></td>
        </tr>
    </table>
      

</div>
