<div class="modal">
	<div class="modal-content">
		<form [formGroup]="itemForm" (ngSubmit)="handleSubmit()">
			<div>
				<label for="task-name">Title</label>
				<input id="task-name" formControlName="title" [(ngModel)]="item.title"/>
				<div class="divRed">
					Title is required.
				</div>
				

			</div>
			<div>
				<label for="task-description">Description</label>
				<textarea id="task-description" formControlName="descr" [(ngModel)]="item.descr"></textarea>
			</div>

			<div>
				<button class="cancel-button" type="button" (click)="handleCancel()">Cancel</button>
				<button class="submit-button" type="submit" >Submit</button>
			</div>
		</form>
	</div>
</div>
